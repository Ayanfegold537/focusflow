<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow</title>
<style>
:root{--bg:#0d0f14;--s:#161a23;--b:#262b38;--t:#e8eaf0;--m:#8b90a6;--a:#f97316}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--s);color:var(--t);margin:4px 0}
button{background:var(--a);border:0;color:#fff;cursor:pointer}button.g{background:var(--s);border:1px solid var(--b)}
.card{max-width:380px;margin:8vh auto;background:var(--s);padding:24px;border-radius:14px;border:1px solid var(--b)}.card input,.card button{width:100%}
header{display:flex;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--b);flex-wrap:wrap}header b{color:var(--a);margin-right:auto}
main{max-width:760px;margin:18px auto;padding:0 14px}.box{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:14px;margin:10px 0}
.err{color:#f43f5e}.m{color:var(--m);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sub{margin-left:26px}.done{text-decoration:line-through;color:var(--m)}
</style></head><body>
<div id="auth" class="card"><h2 id="at"></h2><p id="err" class="err"></p><p id="ok" class="m"></p>
<input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (8+ characters)">
<button id="go" onclick="submitAuth()"></button><p class="m" id="links"></p></div>
<div id="app" hidden><header><b>FocusFlow</b>
<button class="g" onclick="view('tasks')">Tasks</button><button class="g" onclick="view('next')">Do next</button><button class="g" onclick="view('focus')">Focus</button><button class="g" onclick="view('ins')">Insights</button><button class="g" onclick="out()">Log out</button></header>
<main id="v"></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d};
let mode='login',token=new URLSearchParams(location.search).get('token'),timer=null;
function setMode(m){mode=m;$('#err').textContent=$('#ok').textContent='';
 $('#at').textContent={login:'Log in',signup:'Create account',forgot:'Forgot password',reset:'Set new password'}[m];
 $('#go').textContent={login:'Log in',signup:'Sign up',forgot:'Get reset link',reset:'Save password'}[m];
 $('#name').hidden=m!='signup';$('#email').hidden=m=='reset';$('#pw').hidden=m=='forgot';
 $('#links').innerHTML=m=='login'?'<a href="#" onclick="setMode(\'signup\')">Create account</a> · <a href="#" onclick="setMode(\'forgot\')">Forgot password?</a>':'<a href="#" onclick="setMode(\'login\')">Back to log in</a>'}
async function submitAuth(){try{const b={name:$('#name').value,email:$('#email').value,password:$('#pw').value};
 if(mode=='forgot'){const d=await api('forgot','POST',b);$('#ok').innerHTML=d.link?'Reset link: <a href="'+esc(d.link)+'">open it</a>':'If the email exists, a link was created.';return}
 if(mode=='reset'){await api('reset','POST',{token,password:b.password});history.replaceState({},'','/');setMode('login');$('#ok').textContent='Password changed. Log in.';return}
 await api(mode,'POST',b);start()}catch(e){$('#err').textContent=e.message}}
async function start(){try{await api('me');$('#auth').hidden=true;$('#app').hidden=false;view('tasks')}catch{$('#auth').hidden=false;$('#app').hidden=true;setMode(token?'reset':'login')}}
async function out(){await api('logout','POST');start()}
async function view(n){clearInterval(timer);$('#v').innerHTML='';await({tasks,next:nextV,focus:focusV,ins}[n])()}
async function tasks(){const t=await api('tasks'),roots=t.filter(x=>!x.parent);
 $('#v').innerHTML=`<div class="box"><b>Add a task</b><div class="row"><input id="ti" placeholder="e.g. Write final year project report" style="flex:1"><input id="du" type="date"></div>
 <label class="m"><input type="checkbox" id="bd" checked style="margin-right:6px">Let the AI break this into steps</label><br><button onclick="add()">Add</button><p id="why" class="m"></p></div>`+
 roots.map(r=>`<div class="box"><div class="row"><input type="checkbox" ${r.status=='done'?'checked':''} onchange="tog('${r.id}',this.checked)">
 <span class="${r.status=='done'?'done':''}" style="flex:1">${esc(r.title)}</span><span class="m">${esc(r.category)} · ${esc(r.priority)} · ${r.minutes}m ${r.due?'· due '+esc(r.due):''}</span><button class="g" onclick="del('${r.id}')">✕</button></div>
 ${r.why?`<p class="m">Why this plan: ${esc(r.why)}</p>`:''}
 ${t.filter(s=>s.parent==r.id).map(s=>`<div class="row sub"><input type="checkbox" ${s.status=='done'?'checked':''} onchange="tog('${s.id}',this.checked)"><span class="${s.status=='done'?'done':''}">${esc(s.title)}</span><span class="m">${s.minutes}m · ${esc(s.due)}</span></div>`).join('')}</div>`).join('')||'<p class="m">No tasks yet.</p>'}
async function add(){try{const d=await api('tasks','POST',{title:$('#ti').value,due:$('#du').value,breakdown:$('#bd').checked});await tasks();$('#why').textContent=d.why}catch(e){$('#why').textContent=e.message}}
async function tog(id,c){await api('tasks/'+id,'PATCH',{status:c?'done':'open'});tasks()}
async function del(id){if(confirm('Delete this task and its steps?')){await api('tasks/'+id,'DELETE');tasks()}}
function nextV(){$('#v').innerHTML=`<div class="box"><b>What should I do now?</b><div class="row"><select id="en"><option value="low">Low energy</option><option value="medium" selected>Medium energy</option><option value="high">High energy</option></select>
 <input id="mi" type="number" placeholder="Minutes free"><button onclick="suggest()">Suggest</button></div><div id="res"></div></div>`}
async function suggest(){const r=await api(`next?energy=${$('#en').value}&minutes=${$('#mi').value||0}`);
 $('#res').innerHTML=r.map(x=>`<div class="box"><b>${esc(x.title)}</b> <span class="m">${x.minutes}m · score ${x.score}</span><p class="m">${esc(x.reason)}</p></div>`).join('')||'<p class="m">No open tasks.</p>'}
async function focusV(){const i=await api('insights'),t=(await api('tasks')).filter(x=>x.status=='open');let sec=i.suggested_session*60,run=0,el=0;
 $('#v').innerHTML=`<div class="box"><b>Adaptive focus timer</b><p class="m">Suggested length: ${i.suggested_session} min, based on your own past sessions.</p>
 <select id="ft">${t.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select><h1 id="clk">${i.suggested_session}:00</h1><button id="sb">Start</button></div>`;
 const draw=()=>$('#clk').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 const fin=async()=>{clearInterval(timer);run=0;$('#sb').textContent='Start';const m=Math.round(el/60);if(m>0)await api('sessions','POST',{task_id:$('#ft').value,minutes:m});el=0;sec=i.suggested_session*60;draw()};
 $('#sb').onclick=()=>{if(run)return fin();run=1;$('#sb').textContent='Stop and log';timer=setInterval(()=>{sec--;el++;draw();if(sec<=0)fin()},1000)}}
async function ins(){const i=await api('insights');$('#v').innerHTML=`<div class="box"><b>Your patterns</b><p>${esc(i.message)}</p></div>
 <div class="box">Tasks ${i.total} · Done ${i.done} (${i.rate}%) · Overdue ${i.overdue} · Focus ${i.focus} min</div>
 <div class="box m">Postponements by category: ${esc(JSON.stringify(i.postponed))}</div>`}
start();
</script></body></html>
